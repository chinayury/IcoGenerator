name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧 CI run 在新 run 启动时自动取消：
# macOS runner 排队慢且曾出现排队超时被系统取消，此设置从结构上避免重复排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: CLI and ICO smoke test
        shell: bash
        run: |
          set -euo pipefail
          icogen --version
          icogen info
          python -c "from PIL import Image; Image.new('RGBA', (256, 256), (14, 125, 104, 255)).save('smoke.png')"
          icogen convert smoke.png -s 16,32,48,256 -o smoke-out
          python -c "from PIL import Image; im = Image.open('smoke-out/icons/smoke.ico'); sizes = sorted(im.info['sizes']); assert sizes == [(16,16),(32,32),(48,48),(256,256)], sizes; print('ICO sizes:', sizes)"

      - name: Web and API smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          origin=http://127.0.0.2:8765
          icogen serve --host 127.0.0.2 --port 8765 > /dev/null &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --noproxy '*' -fsS "$origin/api/health" > health.json; then
              break
            fi
            sleep 0.5
          done
          cat health.json
          # 版本从 pyproject.toml 动态读取，不再硬编码（版本单一来源整改）
          APP_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          grep -q "\"version\": \"$APP_VERSION\"" health.json
          curl --noproxy '*' -fsS -o /dev/null "$origin/app"
          curl --noproxy '*' -fsS -o /dev/null "$origin/admin"
          # 使用非默认回环地址模拟浏览器通过服务器 IP 提交图片。
          python - <<'PY' > request.json
          import base64
          import json
          from pathlib import Path

          image = base64.b64encode(Path("smoke.png").read_bytes()).decode("ascii")
          print(json.dumps({"image_base64": image, "sizes": [16, 32]}))
          PY
          curl --noproxy '*' -fsS -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data-binary @request.json "$origin/api/generate" > generated.json
          python -c "import json; assert json.load(open('generated.json'))['sizes'] == [[16, 16], [32, 32]]"
          status=$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' -H 'Origin: http://127.0.0.2:8766' \
            -H 'Content-Type: application/json' --data-binary @request.json "$origin/api/generate")
          test "$status" = 403
          echo "web/API smoke test passed"

  build-dist:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t icogenerator:ci .
      - name: Run container health check
        run: |
          set -euo pipefail
          docker run -d --name icogenerator-ci -p 18765:8765 icogenerator:ci
          trap 'docker rm -f icogenerator-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/api/health > health.json; then
              break
            fi
            sleep 1
          done
          cat health.json
          # 版本从 pyproject.toml 动态读取，不再硬编码（版本单一来源整改）
          APP_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          grep -q "\"version\": \"$APP_VERSION\"" health.json
          test "$(docker inspect --format '{{.State.Status}}' icogenerator-ci)" = running
